<body class="bg-slate-100 text-slate-800 min-h-screen pb-28">

<div id="loginOverlay" class="fixed inset-0 bg-slate-900/80 z-[99999] flex items-center justify-center p-3 backdrop-blur-sm pointer-events-auto hidden">
<div class="bg-white w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto relative z-[100000] pointer-events-auto">
<div class="text-center space-y-1">
<div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
<i class="fa-solid fa-ambulance"></i>
</div>
<h2 id="authTitle" class="text-lg font-bold text-slate-800">ເຂົ້າສູ່ລະບົບ</h2>
<p id="authSubtitle" class="text-xs text-slate-500">PSD Ambulance Database</p>
</div>
<div id="loginFormContainer" class="space-y-3">
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ຊື່ຜູ້ໃຊ້ ຫຼື ເບີໂທລະສັບ (Username or Phone)</label>
<input type="text" id="loginUser" placeholder="ຊື່ຜູ້ໃຊ້ ຫຼື ເບີໂທລະສັບ..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ລະຫັດຜ່ານ (Password)</label>
<div class="relative flex items-center">
<input type="password" id="loginPass" placeholder="ລະຫັດຜ່ານ..." class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-3 pr-10 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
<button type="button" onclick="window.togglePasswordVisibility('loginPass', 'eyeIconLogin')" class="absolute right-3 px-1 py-1 text-slate-400 hover:text-slate-600 cursor-pointer z-20">
<i id="eyeIconLogin" class="fa-solid fa-eye text-xs"></i>
</button>
</div>
</div>
<div class="pt-1">
<button type="button" onclick="window.handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl shadow transition cursor-pointer text-xs sm:text-sm">ເຂົ້າສູ່ລະບົບ</button>
</div>
<div class="text-center pt-1">
<button type="button" onclick="window.switchAuthMode('register')" class="text-xs text-indigo-600 hover:underline font-semibold cursor-pointer">ຍັງບໍ່ມີບັນຊີ? ສະໝັກສະມາຊິກ</button>
</div>
</div>
<div id="registerFormContainer" class="space-y-3 hidden">
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ຊື່-ນາມສະກຸນ (Full Name)</label>
<input type="text" id="regName" placeholder="ຊື່ ແລະ ນາມສະກຸນ..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ເບີໂທລະສັບ (Phone Number)</label>
<input type="tel" id="regPhone" placeholder="ຕົວຢ່າງ: 020 XXXXXXXX" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ຊື່ຜູ້ໃຊ້ (Username)</label>
<input type="text" id="regUser" placeholder="ຕັ້ງຊື່ຜູ້ໃຊ້..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 mb-1">ລະຫັດຜ່ານ (Password)</label>
<div class="relative flex items-center">
<input type="password" id="regPass" placeholder="ຕັ້ງລະຫັດຜ່ານ..." class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-3 pr-10 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
<button type="button" onclick="window.togglePasswordVisibility('regPass', 'eyeIconReg')" class="absolute right-3 px-1 py-1 text-slate-400 hover:text-slate-600 cursor-pointer z-20">
<i id="eyeIconReg" class="fa-solid fa-eye text-xs"></i>
</button>
</div>
</div>
<div class="pt-1">
<button type="button" onclick="window.handleRegister()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2.5 rounded-xl shadow transition cursor-pointer text-xs sm:text-sm">ລົງທະບຽນສະໝັກ</button>
</div>
<div class="text-center pt-1">
<button type="button" onclick="window.switchAuthMode('login')" class="text-xs text-slate-600 hover:underline font-semibold cursor-pointer">ມີບັນຊີແລ້ວ? ເຂົ້າສູ່ລະບົບ</button>
</div>
</div>
</div>
</div>

<div class="w-full max-w-7xl mx-auto bg-white min-h-screen shadow-xl flex flex-col px-2 sm:px-6">
<header class="bg-indigo-600 text-white p-3 sm:p-5 my-2 rounded-2xl shadow-md flex flex-col items-center text-center gap-2.5">
<div class="space-y-0.5">
<h1 class="text-sm sm:text-xl font-extrabold tracking-wide"><i class="fa-solid fa-ambulance mr-1.5"></i>PSD Ambulance Database</h1>
<p id="connectionStatus" class="text-[11px] text-emerald-300 font-semibold"><i class="fa-solid fa-cloud mr-1"></i>ກຳລັງເຊື່ອມຕໍ່ລະບົບຄລາວ...</p>
</div>
<div class="w-full pt-2.5 border-t border-indigo-500/50 space-y-2">
<div id="userBarContainer" class="grid grid-cols-2 gap-2 w-full">
<div id="userBadge" onclick="window.openProfileModal()" class="hidden items-center justify-between bg-indigo-700/90 px-3.5 py-2 rounded-xl text-xs font-medium text-indigo-100 shadow cursor-pointer hover:bg-indigo-700 transition w-full truncate">
<div class="flex items-center gap-1.5 truncate">
<i class="fa-solid fa-user-shield text-emerald-400 shrink-0"></i>
<span id="currentUserName" class="truncate font-bold text-white">-</span>
</div>
<div class="flex items-center gap-2 shrink-0">
<span id="currentUserRoleBadge" class="text-[10px] bg-indigo-900 text-indigo-200 px-2 py-0.5 rounded-md font-semibold">-</span>
<span class="w-2.5 h-2.5 bg-emerald-400 rounded-full pulse-dot shrink-0" title="Cloud Live"></span>
</div>
</div>
<button type="button" id="adminUsersBtn" onclick="window.openUsersModal()" class="hidden bg-teal-700 hover:bg-teal-600 text-white text-xs font-medium px-3 py-2 rounded-xl shadow transition items-center justify-center cursor-pointer whitespace-nowrap w-full truncate">
<i class="fa-solid fa-users-gear mr-1.5"></i> ຈັດການຜູ້ໃຊ້ & ສິດ
</button>
</div>
<div class="grid grid-cols-3 sm:grid-cols-6 gap-2 w-full">
<button type="button" onclick="window.openChartModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap">
<i class="fa-solid fa-chart-pie mr-1"></i> ກຣາຟສະຖິຕິ
</button>
<button type="button" onclick="window.openPrintModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap">
<i class="fa-solid fa-print mr-1"></i> ພິມ/ລາຍງານ
</button>
<button type="button" onclick="window.exportToCSV()" class="bg-amber-500 hover:bg-amber-400 text-white text-xs font-medium px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap">
<i class="fa-solid fa-file-excel mr-1"></i> ສົ່ງອອກ Excel
</button>
<button type="button" onclick="window.openBackupModal()" class="bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap">
<i class="fa-solid fa-database mr-1"></i> ສຳຮອງຂໍ້ມູນ
</button>
<button type="button" onclick="window.openRateModal()" class="bg-teal-700 hover:bg-teal-600 text-white text-xs font-medium px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap">
<i class="fa-solid fa-money-bill-transfer mr-1"></i> ຕັ້ງຄ່າເລດເງິນ
</button>
<button type="button" onclick="window.handleLogout()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-medium px-2 py-2 rounded-xl shadow transition flex items-center justify-center cursor-pointer whitespace-nowrap" title="ອອກຈາກລະບົບ">
<i class="fa-solid fa-right-from-bracket mr-1"></i> ອອກຈາກລະບົບ
</button>
</div>
</div>
</header>

<div id="profileModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
<div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4 text-center">
<div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
<i class="fa-solid fa-user-tie"></i>
</div>
<div>
<h3 id="profileFullName" class="text-base font-bold text-slate-800">-</h3>
<p id="profileRoleText" class="text-xs text-indigo-600 font-semibold mt-0.5">-</p>
</div>
<div class="bg-slate-50 p-3 rounded-xl text-left space-y-2 text-xs">
<div><span class="text-slate-400 block font-semibold">ຊື່ຜູ້ໃຊ້:</span> <span id="profileUsername" class="text-slate-700 font-bold">-</span></div>
<div><span class="text-slate-400 block font-semibold">ເບີໂທລະສັບ:</span> <span id="profilePhone" class="text-slate-700 font-bold">-</span></div>
</div>
<button type="button" onclick="window.closeProfileModal()" class="w-full bg-slate-800 text-white py-2.5 rounded-xl text-xs font-medium cursor-pointer">ປິດໜ້າຕ່າງ</button>
</div>
</div>

<div class="bg-slate-100 p-2.5 rounded-xl mb-3 flex flex-col sm:flex-row gap-2 items-center justify-between">
<div class="flex items-center gap-2 w-full sm:w-auto">
<label for="monthFilter" class="text-xs font-semibold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i> ເລືອກເດືອນ/ປີ:</label>
<select id="monthFilter" onchange="window.filterRecords()" class="bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48 text-left">
<option value="all">ທັງໝົດທຸກເດືອນ</option>
</select>
</div>
<div class="grid grid-cols-2 sm:flex gap-2 w-full sm:w-auto items-center">
<div class="relative w-full sm:w-64">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
<input type="text" id="searchInput" oninput="window.filterRecords()" placeholder="ຄົ້ນຫາຊື່ເຄສ, ສະຖານທີ່..." class="w-full bg-white border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
</div>
<div class="w-full sm:w-auto">
<button type="button" onclick="window.openModal()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl shadow transition cursor-pointer text-xs whitespace-nowrap flex items-center justify-center gap-1.5">
<i class="fa-solid fa-plus"></i> <span>ເພີ່ມເຄສໃໝ່</span>
</button>
</div>
</div>
</div>

<div id="dashboardSummaryBox" class="mb-3 bg-white p-3 rounded-2xl shadow border border-slate-200">
<div class="flex items-center justify-between px-1 mb-1">
<div class="flex items-center gap-1.5 flex-wrap">
<i class="fa-solid fa-chart-column text-indigo-600 text-xs shrink-0"></i>
<span class="font-bold text-slate-800 text-xs sm:text-sm">ຕາຕະລາງສະຫຼຸບຍອດລວມ</span>
<span id="summaryMonthLabel" class="text-indigo-600 font-semibold bg-indigo-50 px-1.5 py-0.5 rounded-lg border border-indigo-100 text-[11px] shrink-0">(ເດືອນ 10/2026)</span>
</div>
<div class="relative">
<button type="button" onclick="window.toggleSummaryMenu(event)" class="text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 px-2.5 py-1 rounded-lg border border-slate-200 transition font-semibold flex items-center gap-1 shrink-0 cursor-pointer text-[11px]">
<i class="fa-solid fa-ellipsis-vertical text-[10px]"></i> ເມນູ
</button>
<div id="summaryMenuDropdown" class="hidden absolute right-0 mt-1 w-44 bg-white rounded-xl shadow-xl border z-50 py-1 text-xs">
<button type="button" onclick="window.exportSummaryAction('pdf')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700 cursor-pointer">
<i class="fa-solid fa-file-pdf text-amber-600 w-4"></i> ດາວໂຫຼດ PDF
</button>
<button type="button" onclick="window.exportSummaryAction('image')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700 cursor-pointer">
<i class="fa-solid fa-image text-indigo-600 w-4"></i> ບັນທຶກເປັນຮູບ
</button>
<button type="button" onclick="window.exportSummaryAction('print')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700 cursor-pointer">
<i class="fa-solid fa-print text-emerald-600 w-4"></i> ສັ່ງພິມ
</button>
</div>
</div>
</div>
<div class="px-1 -mt-1.5 mb-1.5 text-left">
<span id="summaryTotalCasesLabel" class="text-[11px] text-slate-500 font-bold inline-flex items-center gap-1"><i class="fa-solid fa-list-check text-indigo-500 text-[10px]"></i>(ລວມທັງໝົດ 0 ເຄສ)</span>
</div>
<div class="overflow-x-auto mt-0.5">
<table id="summaryTableElement" class="w-full text-xs sm:text-sm border-collapse table-fixed">
<thead>
<tr class="bg-indigo-600 text-white font-bold text-xs sm:text-sm">
<th class="py-1.5 px-3 text-left border border-indigo-700 w-[50%]">ລາຍການຫຼັກ / ຄ່າໃຊ້ຈ່າຍ</th>
<th class="py-1.5 px-3 text-right border border-indigo-700 w-[50%]">ຈຳນວນເງິນລວມ</th>
</tr>
</thead>
<tbody id="dashboardSummaryTbody">
<tr class="bg-slate-50"><td class="py-1.5 px-3 border border-slate-200 font-bold text-emerald-700 text-xs sm:text-sm"><i class="fa-solid fa-arrow-trend-up mr-1.5"></i>ລາຍຮັບລວມ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-lg sm:text-xl font-black text-emerald-700">0 ₭</td></tr>
<tr class="bg-slate-50"><td class="py-1.5 px-3 border border-slate-200 font-bold text-rose-700 text-xs sm:text-sm"><i class="fa-solid fa-gas-pump mr-1.5"></i>ຄ່ານ້ຳມັນລວມ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-sm sm:text-base font-black text-rose-700">0 ₭</td></tr>
<tr class="bg-slate-50"><td class="py-1.5 px-3 border border-slate-200 font-bold text-amber-700 text-xs sm:text-sm"><i class="fa-solid fa-utensils mr-1.5"></i>ຄ່າກິນລວມ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-sm sm:text-base font-black text-amber-700">0 ₭</td></tr>
<tr class="bg-slate-50"><td class="py-1.5 px-3 border border-slate-200 font-bold text-purple-700 text-xs sm:text-sm"><i class="fa-solid fa-wallet mr-1.5"></i>ເງິນເບີກລວມ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-sm sm:text-base font-black text-purple-700">0 ₭</td></tr>
<tr class="bg-slate-50"><td class="py-1.5 px-3 border border-slate-200 font-bold text-teal-700 text-xs sm:text-sm"><i class="fa-solid fa-receipt mr-1.5"></i>ຄ່າໃຊ້ຈ່າຍອື່ນໆລວມ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-sm sm:text-base font-black text-teal-700">0 ₭</td></tr>
<tr class="bg-indigo-50 font-bold text-xs sm:text-sm"><td class="py-1.5 px-3 border border-slate-200 text-indigo-950 text-xs sm:text-sm font-black"><i class="fa-solid fa-scale-balanced mr-1.5"></i>ຍອດເງີນເຫຼືອທັງໝົດ</td><td class="py-1.5 px-3 border border-slate-200 text-right text-lg sm:text-xl font-black text-indigo-900" id="sumNetText">0 ₭</td></tr>
</tbody>
</table>
</div>
</div>

<div class="text-center pt-1 pb-2 border-b border-slate-200 mb-2">
<span class="text-xs text-slate-700 font-bold" id="filterCountInfo">ສະແດງທັງໝົດ 0 ລາຍການ</span>
</div>

<div class="flex-1 w-full overflow-x-auto pb-20">
<div class="inline-block min-w-full align-middle">
<table class="w-auto min-w-full divide-y divide-slate-200 text-left text-xs sm:text-sm border border-slate-200 rounded-xl overflow-hidden shadow-sm">
<thead class="bg-slate-100 text-slate-700 font-semibold">
<tr>
<th class="py-3 px-2 text-center whitespace-nowrap font-bold border-b">ລຳດັບ</th>
<th class="py-3 px-2 whitespace-nowrap font-bold border-b">ປະເພດລາຍການ</th>

function convertToLAK(amount, currency) {
if (!amount || isNaN(amount)) return 0;
const rate = exchangeRates[currency] || 1;
return Math.round(amount * rate);
}

async function initAuth() {

}

onAuthStateChanged(auth, (u) => {

setupCloudListeners();
}
});

function setupCloudListeners() {
if (!user) return;
const recRef = collection(db, 'artifacts', appId, 'public', 'data', 'ambulance_records');
onSnapshot(recRef, (snapshot) => {
records = [];
snapshot.forEach(docSnap => {
records.push({ id: docSnap.id, ...docSnap.data() });
});
records.sort((a, b) => {
const dateA = new Date(a.datetime || '1970-01-01');
const dateB = new Date(b.datetime || '1970-01-01');
if (dateA - dateB !== 0) return dateA - dateB;
const seqA = parseInt(a.seqNo) || 0;
const seqB = parseInt(b.seqNo) || 0;
return seqA - seqB;
});
updateMonthDropdown();
filterRecords();
}, (err) => console.error("Rec fetch error:", err));

const userRef = collection(db, 'artifacts', appId, 'public', 'data', 'system_users');
onSnapshot(userRef, (snapshot) => {
allUsers = [];
snapshot.forEach(docSnap => {
allUsers.push({ id: docSnap.id, ...docSnap.data() });
});
if (typeof window.renderUsersTable === 'function') {
window.renderUsersTable();
}
}, (err) => console.error("User fetch error:", err));
}

window.openCasePrintModal = function(id) {
const r = records.find(x => x.id === id);
if (!r) return;
const incAmt = r.incomeAmount || 0;
const incCurr = r.incomeCurrency || 'LAK';
const fuelAmt = r.fuelAmount || 0;
const fuelCurr = r.fuelCurrency || 'LAK';
const foodAmt = r.foodAmount || 0;
const foodCurr = r.foodCurrency || 'LAK';

let withdrawDetails = '-';
let totalW = 0;
if (r.withdrawers && Array.isArray(r.withdrawers) && r.withdrawers.length > 0) {
withdrawDetails = r.withdrawers.map(w => {
const wAmt = w.amount || 0;
const wCurr = w.currency || 'LAK';
totalW += convertToLAK(wAmt, wCurr);
return `<div class="font-bold text-purple-700">• ${w.name}: ${wAmt.toLocaleString()} ${wCurr}</div>`;
}).join('');
} else if (r.withdrawAmount) {
const wAmt = r.withdrawAmount || 0;
const wCurr = r.withdrawCurrency || 'LAK';
totalW += convertToLAK(wAmt, wCurr);
withdrawDetails = `<div class="font-bold text-purple-700">• ${r.withdrawerName || 'ຜູ້ເບີກ'}: ${wAmt.toLocaleString()} ${wCurr}</div>`;
}

let customDetails = '-';
let totalC = 0;
if (r.customExpenses && Array.isArray(r.customExpenses) && r.customExpenses.length > 0) {
customDetails = r.customExpenses.map(e => {
const eAmt = e.amount || 0;
const eCurr = e.currency || 'LAK';
totalC += convertToLAK(eAmt, eCurr);
const expName = e.name ? e.name.trim() : 'ອື່ນໆ';
return `<div class="font-bold text-teal-800">• ${expName}: ${eAmt.toLocaleString()} ${eCurr}</div>`;
}).join('');
}

const incLAK = convertToLAK(incAmt, incCurr);
const fuelLAK = convertToLAK(fuelAmt, fuelCurr);
const foodLAK = convertToLAK(foodAmt, foodCurr);
const totalExpense = fuelLAK + foodLAK + totalW + totalC;
const netBalanceLAK = incLAK - totalExpense;

let savedUser = {};

const expName = e.name ? e.name.trim() : 'ອື່ນໆ';

customExpMap[expName] = (customExpMap[expName] || 0) + eLAK;
customTotalLAK += eLAK;
});
}
});
const centerTotalValue = fuelLAK + foodLAK + withdrawLAK + customTotalLAK;
let chartLabels = ['ຄ່ານ້ຳມັນ', 'ຄ່າກິນ', 'ເງິນເບີກ'];
let chartData = [fuelLAK, foodLAK, withdrawLAK];

Object.entries(customExpMap).forEach(([name, amt]) => {

});
if (myChart) myChart.destroy();
const centerTextPlugin = {
id: 'centerText',
beforeDraw(chart) {

if (!chartArea) return;
const centerX = (chartArea.left + chartArea.right) / 2;
const centerY = (chartArea.top + chartArea.bottom) / 2;
ctx.save();
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.font = 'bold 16px Phetsarath';
ctx.fillStyle = '#1e293b';
const text = centerTotalValue > 0 ? centerTotalValue.toLocaleString() + ' ₭' : '0 ₭';
ctx.fillText(text, centerX, centerY - 8);
ctx.font = '11px Phetsarath';
ctx.fillStyle = '#64748b';
ctx.fillText('ລາຍຈ່າຍລວມ (LAK)', centerX, centerY + 14);
ctx.restore();
}
};
myChart = new Chart(ctx, {
type: 'doughnut',
data: {
labels: chartLabels,
datasets: [{
data: chartData,
backgroundColor: chartColors,
borderWidth: 2
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
cutout: '75%',
plugins: {
legend: {
position: 'left',
align: 'center',
labels: {
font: {
family: 'Phetsarath',
size: 11
},
boxWidth: 12,
padding: 12
}
}
}
},
plugins: [centerTextPlugin]
});
}

window.exportToCSV = function() {
try {
const monthVal = document.getElementById('monthFilter').value;
let targetRecords = records;
if (monthVal !== 'all' && !monthVal.startsWith('year_')) {
targetRecords = records.filter(r => r.datetime && r.datetime.startsWith(monthVal));
} else if (monthVal.startsWith('year_')) {
const year = monthVal.replace('year_', '');
targetRecords = records.filter(r => r.datetime && r.datetime.startsWith(year));
}

if (targetRecords.length === 0) {
showAlert('ບໍ່ມີຂໍ້ມູນໃນເດືອນນີ້ສຳລັບສົ່ງອອກ!', null, 'error');
return;
}
let csv = "\uFEFFລຳດັບ,ປະເພດ,ຊື່ເຄສ,ວັນທີ,ຕົ້ນທາງ,ປາຍທາງ,ລາຍຮັບ,ຄ່ານ້ຳມັນ,ຄ່າກິນ,ເງິນເບີກ,ຄ່າໃຊ້ຈ່າຍອື່ນໆ,ຍອດເຫຼືອ (LAK),ໝາຍເຫດ\n";
targetRecords.forEach((r, idx) => {
const incAmt = r.incomeAmount || 0;
const incCurr = r.incomeCurrency || 'LAK';
const fuelAmt = r.fuelAmount || 0;
const fuelCurr = r.fuelCurrency || 'LAK';
const foodAmt = r.foodAmount || 0;
const foodCurr = r.foodCurrency || 'LAK';

const incLAK = convertToLAK(incAmt, incCurr);
const fuelLAK = convertToLAK(fuelAmt, fuelCurr);
const foodLAK = convertToLAK(foodAmt, foodCurr);

let wSum = 0;
if (r.withdrawers && Array.isArray(r.withdrawers)) {
r.withdrawers.forEach(w => wSum += convertToLAK(w.amount || 0, w.currency || 'LAK'));
} else if (r.withdrawAmount) {
wSum += convertToLAK(r.withdrawAmount || 0, r.withdrawCurrency || 'LAK');
}

let cSum = 0;
if (r.customExpenses && Array.isArray(r.customExpenses)) {
r.customExpenses.forEach(e => cSum += convertToLAK(e.amount || 0, e.currency || 'LAK'));
}

const net = incLAK - (fuelLAK + foodLAK + wSum + cSum);
csv += `"${idx + 1}","${r.categoryType}","${r.patientName}","${r.datetime ? formatDateToDisplay(r.datetime) : ''}","${r.pickupLocation}","${r.dropoffLocation}","${incAmt} ${incCurr}","${fuelAmt} ${fuelCurr}","${foodAmt} ${foodCurr}",${wSum},${cSum},${net},"${r.note || ''}"\n`;
});
const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = "psd_ambulance_report_" + (monthVal === 'all' ? 'all' : monthVal) + ".csv";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
showAlert('ດາວໂຫຼດໄຟລ໌ Excel/CSV ສຳເລັດແລ້ວ!', null, 'success');
} catch (err) {
showAlert('ເກີດຂໍ້ຜິດພາດໃນການສົ່ງອອກໄຟລ໌', null, 'error');
}
};

window.handleLogin = function() {
const u = document.getElementById('loginUser').value.trim();
const p = document.getElementById('loginPass').value.trim();
if (!u || !p) { showAlert('ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບຖ້ວນ', null, 'error'); return; }
let masterAdmin = JSON.parse(localStorage.getItem('master_admin_account') || JSON.stringify({ name: 'Admin', phone: '-', username: 'admin', pass: '1234', role: 'admin', status: 'approved' }));
if (u === masterAdmin.username && p === masterAdmin.pass) {
const adminData = { name: masterAdmin.name || 'Admin', username: masterAdmin.username || 'admin', phone: masterAdmin.phone || '-', role: 'admin', staffPermission: 'edit' };
localStorage.setItem('auth_user', JSON.stringify(adminData));
applyLoginState(adminData);
return;
}
const found = allUsers.find(x => (x.username === u || x.phone === u) && x.pass === p);
if (!found) {
showAlert('ຊື່ຜູ້ໃຊ້ ຫຼື ເບີໂທລະສັບ ແລະ ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ', null, 'error');
return;
}
if (found.status !== 'approved') {
showAlert('ບັນຊີຂອງທ່ານຍັງບໍ່ໄດ້ຮັບການອະນຸມັດ', null, 'error');
return;
}
localStorage.setItem('auth_user', JSON.stringify(found));
applyLoginState(found);
};

function checkSavedLogin() {
let saved = null;
try {
saved = localStorage.getItem('auth_user') || sessionStorage.getItem('auth_user');
} catch(e) { saved = null; }
if (saved) {
try {
applyLoginState(JSON.parse(saved));
} catch(e) {

if (overlay) overlay.classList.remove('hidden');
}
} else {
const overlay = document.getElementById('loginOverlay');
if (overlay) overlay.classList.remove('hidden');
}
}

function applyLoginState(userData) {
const overlay = document.getElementById('loginOverlay');
if (overlay) overlay.classList.add('hidden');
const ub = document.getElementById('userBadge');
if (ub) ub.classList.remove('hidden');
const cun = document.getElementById('currentUserName');
if (cun) cun.innerText = userData.name || userData.username;
const adminUsersBtn = document.getElementById('adminUsersBtn');
const currentUserRoleBadge = document.getElementById('currentUserRoleBadge');
if (userData.role === 'admin') {

} else {
if (adminUsersBtn) adminUsersBtn.classList.add('hidden');
if (currentUserRoleBadge) currentUserRoleBadge.innerText = "Staff";
}
window.filterRecords();
}

function setDefaultDate() {
const today = new Date().toISOString().slice(0, 10);
const dtEl = document.getElementById('datetime');
if (dtEl) dtEl.value = today;
}
window.onDateChange = function() {
const dtEl = document.getElementById('datetime');
if (!dtEl || !dtEl.value) return;
const selectedDate = dtEl.value;
const ym = selectedDate.slice(0, 7);
const monthRecords = records.filter(r => r.datetime && r.datetime.startsWith(ym));
let maxSeq = 0;
monthRecords.forEach(r => {
const s = parseInt(r.seqNo) || 0;
if (s > maxSeq) maxSeq = s;
});
const nextSeq = (maxSeq + 1).toString().padStart(2, '0');
const seqEl = document.getElementById('seqNo');
if (seqEl && !seqEl.dataset.manualEdited) {
seqEl.value = nextSeq;
}
};

window.formatMoneyInput = function(input) {
let val = input.value.replace(/,/g, '').replace(/\D/g, '');
if (val === '') { input.value = ''; return; }
input.value = parseInt(val, 10).toLocaleString();
};

function parseMoney(str) {
if (!str) return 0;
return parseInt(str.toString().replace(/,/g, ''), 10) || 0;
}

});

window.filterRecords = function() {
const search = document.getElementById('searchInput').value.toLowerCase().trim();
const monthVal = document.getElementById('monthFilter').value;
const filtered = records.filter(r => {
const dt = r.datetime || '';
if (monthVal !== 'all') {

if (!dt.startsWith(yr)) return false;
} else {
if (!dt.startsWith(monthVal)) return false;
}
}
if (search) {
const matchName = (r.patientName || '').toLowerCase().includes(search);
const matchPickup = (r.pickupLocation || '').toLowerCase().includes(search);
const matchDrop = (r.dropoffLocation || '').toLowerCase().includes(search);
const matchCat = (r.categoryType || '').toLowerCase().includes(search);
if (!matchName && !matchPickup && !matchDrop && !matchCat) return false;
}
return true;
});
renderTable(filtered);
};

function formatDateToDisplay(dateStr) {

const parts = dateStr.split('-');

}
return dateStr;
}
